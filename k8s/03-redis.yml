apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: geosentinel
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: [redis-server, --requirepass, $(REDIS_PASSWORD), --appendonly, yes]
          ports: [{containerPort: 6379}]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: gs-secrets, key: REDIS_PASSWORD}
          resources:
            limits: {memory: 256Mi, cpu: 200m}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: geosentinel
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
