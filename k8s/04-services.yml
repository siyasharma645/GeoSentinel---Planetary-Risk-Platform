# All Spring Boot microservices
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: geosentinel
spec:
  replicas: 2
  selector:
    matchLabels: {app: api-gateway}
  template:
    metadata:
      labels: {app: api-gateway}
    spec:
      containers:
        - name: api-gateway
          image: geosentinel/api-gateway:1.0.0
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: gs-config}
            - secretRef: {name: gs-secrets}
          env:
            - {name: DB_URL, value: "jdbc:postgresql://postgres-service:5432/geosentinel"}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 40
            periodSeconds: 10
          resources:
            requests: {memory: "256Mi", cpu: "200m"}
            limits:   {memory: "512Mi", cpu: "500m"}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: geosentinel
spec:
  selector: {app: api-gateway}
  ports: [{port: 8080}]
