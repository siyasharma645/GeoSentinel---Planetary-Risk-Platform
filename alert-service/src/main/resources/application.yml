server:
  port: 8085
spring:
  application.name: alert-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/geosentinel}
    username: ${DB_USER:geosentinel}
    password: ${DB_PASSWORD:gs_secret}
    hikari.maximum-pool-size: 10
  jpa:
    hibernate.ddl-auto: validate
    show-sql: false
    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
    password: ${REDIS_PASSWORD:gs_redis}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: alert-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap
springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /swagger-ui.html
management.endpoints.web.exposure.include: health,info,prometheus
